name: Release

# Push a tag matching the app version in apps/desktop/electrobun.config.ts, e.g. `v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Tag names can hold shell metacharacters, so they reach scripts through env, never ${{ }}.
      - name: Check tag against app version
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          APP_VERSION="$(bun -e "import c from './apps/desktop/electrobun.config.ts'; console.log(c.app.version)")"
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::error::tag $TAG does not match app version $APP_VERSION in apps/desktop/electrobun.config.ts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Electrobun SDK
        working-directory: apps/desktop
        run: bunx electrobun prepare

      - run: bun test

      - run: bun run typecheck

  macos:
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Package
        working-directory: apps/desktop
        run: bun run package

      - name: Name the installer
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir out
          cp apps/desktop/artifacts/macos-arm64-Cairn.dmg "out/Cairn-${VERSION}-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Package
        working-directory: apps/desktop
        run: bun run package

      # Electrobun names the Windows installer itself; pick it up by shape rather than by exact name.
      - name: Name the installer
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -la apps/desktop/artifacts
          mkdir out
          SETUP="$(find apps/desktop/artifacts -maxdepth 1 -type f \( -iname '*Setup*.exe' -o -iname '*Setup*.zip' \) | head -n1)"
          if [ -z "$SETUP" ]; then
            echo "::error::no Windows installer found in apps/desktop/artifacts"
            exit 1
          fi
          cp "$SETUP" "out/Cairn-${VERSION}-x64-Setup.${SETUP##*.}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  publish:
    needs: [check, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "Cairn $VERSION" --generate-notes

  homebrew:
    needs: [check, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: out

      # The deploy key can write to jiehaoZ/homebrew-tap and nothing else.
      - name: Point the cask at this release
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          SHA="$(sha256sum "out/Cairn-${VERSION}-arm64.dmg" | cut -d' ' -f1)"
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:jiehaoZ/homebrew-tap.git tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/cairn.rb
          git diff --quiet && { echo "cask already at $VERSION"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "chore: cairn ${VERSION}"
          git push -q origin HEAD:main
